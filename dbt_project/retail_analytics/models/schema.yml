
version: 2

models:

  - name: monthly_sales_summary
    description: "Monthly sales performance summary containing transaction volume, quantity, and revenue."
    columns:
      - name: year
        description: "Year of the sales period."
        tests:
          - not_null

      - name: month
        description: "Month number of the sales period."
        tests:
          - not_null

      - name: transaction_count
        description: "Number of sales transactions in the month."

      - name: total_quantity
        description: "Total quantity of products sold in the month."

      - name: total_revenue
        description: "Total revenue generated from sales in the month."
        tests:
          - not_null


  - name: customer_analytics_summary
    description: "Customer-level sales and revenue analytics for customers with available customer IDs."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null

      - name: country
        description: "Customer's country."

      - name: order_count
        description: "Number of orders placed by the customer."

      - name: total_quantity
        description: "Total quantity purchased by the customer."

      - name: total_revenue
        description: "Total revenue generated by the customer."
        tests:
          - not_null

      - name: average_order_value
        description: "Average revenue per order for the customer."


  - name: product_analytics_summary
    description: "Product-level sales performance and revenue analytics."
    columns:
      - name: stockcode
        description: "Unique product stock code."
        tests:
          - not_null

      - name: description
        description: "Product description."

      - name: order_count
        description: "Number of orders containing the product."

      - name: total_quantity
        description: "Total quantity sold for the product."

      - name: total_revenue
        description: "Total revenue generated by the product."

      - name: average_price
        description: "Average selling price of the product."


  - name: country_analytics_summary
    description: "Country-level sales performance and customer analytics."
    columns:
      - name: country
        description: "Customer country."
        tests:
         - not_null

      - name: order_count
        description: "Number of orders from the country."

      - name: unique_customers
        description: "Number of unique customers from the country."

      - name: total_quantity
        description: "Total quantity sold to the country."

      - name: total_revenue
        description: "Total revenue generated from the country."

      - name: average_order_value
        description: "Average revenue per order for the country."


  - name: transaction_overview
    description: "Summary of sales, returns, cancellations, and financial adjustments."
    columns:
      - name: transaction_type
        description: "Transaction classification: SALE, RETURN, CANCELLATION, or ADJUSTMENT."
        tests:
          - not_null
          - accepted_values:
              values:
                - SALE
                - RETURN
                - CANCELLATION
                - ADJUSTMENT

      - name: transaction_count
        description: "Number of transactions of each type."

      - name: total_quantity
        description: "Total quantity associated with each transaction type."

      - name: total_revenue
        description: "Total revenue impact of each transaction type."
